name: Windows RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    steps:
      - name: Hubungkan ke Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          version: latest

      - name: Konfigurasi RDP & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-Service -Name TermService -StartupType Automatic
          Start-Service TermService
          net user runneradmin "${{ secrets.RDP_PASSWORD }}"
          
      - name: Dapatkan IP Tailscale
        run: |
          $TailscaleIP = tailscale ip -4
          Write-Host "=================================================="
          Write-Host "RDP Siap Digunakan!"
          Write-Host "IP Address : $TailscaleIP"
          Write-Host "Username   : runneradmin"
          Write-Host "Password   : (Gunakan password dari secret RDP_PASSWORD)"
          Write-Host "=================================================="
          
      - name: Tahan Sesi & Fitur Stop
        run: |
          # 1. Buat tombol Stop di Desktop RDP
          $DesktopPath = "C:\Users\runneradmin\Desktop"
          if (-not (Test-Path $DesktopPath)) { New-Item -ItemType Directory -Force -Path $DesktopPath }
          $StopButton = "$DesktopPath\TUTUP_RDP.cmd"
          Set-Content -Path $StopButton -Value "echo 1 > C:\Users\Public\stop_rdp.flag"
          
          Write-Host "Sesi aktif. Menunggu batas maksimal 6 jam atau sinyal berhenti..."
          Write-Host "Untuk mematikan RDP, klik dua kali file 'TUTUP_RDP.cmd' di Desktop Windows Anda."
          
          # 2. Loop penahan sesi yang akan mengecek keberadaan file bendera (flag)
          $time = 0
          while (!(Test-Path "C:\Users\Public\stop_rdp.flag") -and ($time -lt 21600)) {
            Start-Sleep -Seconds 30
            $time += 30
            if ($time % 300 -eq 0) { Write-Host "Sesi masih berjalan..." }
          }
          
          Write-Host "Menerima perintah berhenti. Menutup sesi RDP dan menyelesaikan GitHub Actions..."
