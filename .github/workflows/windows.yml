name: Windows RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    steps:
      - name: Install & Login Tailscale secara manual
        run: |
          Write-Host "Mengunduh installer Tailscale..."
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
          
          Write-Host "Menginstal Tailscale (Silent Install)..."
          Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet" -Wait -NoNewWindow
          
          Write-Host "Login ke jaringan Tailscale..."
          # Menjalankan CLI Tailscale menggunakan absolute path agar tidak error
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname="github-windows-rdp"

      - name: Konfigurasi RDP & Firewall
        env:
          RDP_PASS: ${{ secrets.RDP_PASSWORD }}
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-Service -Name TermService -StartupType Automatic
          Start-Service TermService
          
          # Menggunakan variable env bawaan PowerShell untuk membaca secret
          net user runneradmin "RahasiaRDP!2026"
          
      - name: Dapatkan IP Tailscale
        run: |
          $TailscaleIP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "=================================================="
          Write-Host "RDP Siap Digunakan!"
          Write-Host "IP Address : $TailscaleIP"
          Write-Host "Username   : runneradmin"
          Write-Host "Password   : (Gunakan password dari secret RDP_PASSWORD)"
          Write-Host "=================================================="

      - name: Auto-Setup Proxifier untuk Aplikasi Target
        env:
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_PORT: ${{ secrets.PROXY_PORT }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
          # Ubah nama aplikasi di bawah ini sesuai dengan target Anda
          TARGET_APPS: "telegram.exe; chrome.exe; bot-app.exe" 
        run: |
          Write-Host "Mengunduh Proxifier Portable..."
          Invoke-WebRequest -Uri "https://www.proxifier.com/download/ProxifierPE.zip" -OutFile "C:\Users\runneradmin\Desktop\ProxifierPE.zip"
          Expand-Archive -Path "C:\Users\runneradmin\Desktop\ProxifierPE.zip" -DestinationPath "C:\Users\runneradmin\Desktop\Proxifier" -Force
          
          Write-Host "Membuat Profil XML Proxifier..."
          # CATATAN: Pada baris <Proxy id="101" type="HTTPS">, ubah HTTPS menjadi SOCKS5 jika proxy Anda berjenis SOCKS5.
          $ProfileXML = @"
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <ProxifierProfile version="102" platform="Windows" product_id="0" product_minver="400">
            <Options>
              <Resolve>
                <AutoModeDetection>true</AutoModeDetection>
                <ViaProxy>true</ViaProxy>
                <ExclusionList>localhost; %ComputerName%; *.local; </ExclusionList>
              </Resolve>
            </Options>
            <ProxyList>
              <Proxy id="101" type="HTTPS">
                <Address>$env:PROXY_HOST</Address>
                <Port>$env:PROXY_PORT</Port>
                <Options>48</Options>
                <Authentication enabled="true">
                  <Username>$env:PROXY_USER</Username>
                  <Password>$env:PROXY_PASS</Password>
                </Authentication>
              </Proxy>
            </ProxyList>
            <ChainList />
            <RuleList>
              <Rule enabled="true">
                <Name>Localhost</Name>
                <Targets>localhost; 127.0.0.1; %ComputerName%; ::1</Targets>
                <Action type="Direct" />
              </Rule>
              <Rule enabled="true">
                <Name>Aplikasi Target Custom</Name>
                <Applications>$env:TARGET_APPS</Applications>
                <Action type="Proxy">101</Action>
              </Rule>
              <Rule enabled="true">
                <Name>Default (Aman untuk Tailscale)</Name>
                <Action type="Direct" />
              </Rule>
            </RuleList>
          </ProxifierProfile>
          "@
          
          Set-Content -Path "C:\Users\runneradmin\Desktop\Proxifier\AutoProfile.prx" -Value $ProfileXML
          
          Write-Host "Menjalankan Proxifier secara senyap..."
          Start-Process -FilePath "C:\Users\runneradmin\Desktop\Proxifier\Proxifier.exe" -ArgumentList "C:\Users\runneradmin\Desktop\Proxifier\AutoProfile.prx", "/SILENT"
      - name: Tahan Sesi & Fitur Stop
        run: |
          # 1. Buat tombol Stop di Desktop RDP
          $DesktopPath = "C:\Users\runneradmin\Desktop"
          if (-not (Test-Path $DesktopPath)) { New-Item -ItemType Directory -Force -Path $DesktopPath }
          $StopButton = "$DesktopPath\TUTUP_RDP.cmd"
          Set-Content -Path $StopButton -Value "echo 1 > C:\Users\Public\stop_rdp.flag"
          
          Write-Host "Sesi aktif. Menunggu batas maksimal 6 jam atau sinyal berhenti..."
          Write-Host "Untuk mematikan RDP, klik dua kali file 'TUTUP_RDP.cmd' di Desktop Windows Anda."
          
          # 2. Loop penahan sesi yang akan mengecek keberadaan file bendera (flag)
          $time = 0
          while (!(Test-Path "C:\Users\Public\stop_rdp.flag") -and ($time -lt 21600)) {
            Start-Sleep -Seconds 30
            $time += 30
            if ($time % 300 -eq 0) { Write-Host "Sesi masih berjalan..." }
          }
          
          Write-Host "Menerima perintah berhenti. Menutup sesi RDP dan menyelesaikan GitHub Actions..."
